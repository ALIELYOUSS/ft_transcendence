services:
  db:
    image: postgres
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    
    environment:
      - DB_USER=ali
      - DB_PASSWORD=555
      - DB_NAME=trans_db
    
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080